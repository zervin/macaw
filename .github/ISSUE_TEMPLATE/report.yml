name: Report a problem
description: Something in the macaw packages does not work as it should.
body:
  - type: markdown
    attributes:
      value: >-
        Problems that also happen with the official Myna snaps belong
        [upstream](https://github.com/canonical/myna/issues). Security problems:
        see [SECURITY.md](https://github.com/zervin/macaw/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: >-
        Filled in when you report from Myna Settings (main menu > Report an Issue).
        Otherwise open Myna Settings > Diagnostics, copy the report and paste it here.
        It includes no audio or transcripts.
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: "Output of: journalctl --user -u myna-desktop -u myna-server --since -10min"
      render: text
