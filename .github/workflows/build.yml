name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  debs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Fetch submodule tags (version comes from git describe)
        run: git -C myna fetch --tags --unshallow 2>/dev/null || git -C myna fetch --tags
      - name: Build debs in debian:trixie
        run: ./build.sh "${GITHUB_RUN_NUMBER}"
      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: dist/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debs
    runs-on: ubuntu-24.04
    environment: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: debs
          path: dist
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.deb --generate-notes
      - name: Build signed apt repository
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: ./ci/apt-repo.sh dist site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - uses: actions/deploy-pages@v4
