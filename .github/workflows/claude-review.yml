name: claude-review

# An advisory Claude reviewer (anthropics/claude-code-action):
# - reviews each non-draft pull request from a branch of this repository;
# - answers "@claude" in issues and pull requests from people with write access.
# It never approves, merges, pushes or releases. When something needs a human
# decision it adds the `needs-human` label. See CONTRIBUTING.md, "Reviews".
#
# Pull requests from forks are skipped: they get no secrets, and the action
# refuses to run outside contributors' code anyway. Needs one secret,
# ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; without it the jobs skip.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
  # zizmor: ignore[dangerous-triggers] -- the action acts only for users with
  # write access, checks out the base branch (never PR code) and holds no
  # write credentials beyond comments and labels.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

env:
  HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@d5f7970ae232b6039636a16ea7f251e58e814f38 # v1.0.272
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the advisory reviewer for macaw, the Debian packaging of
            Canonical's Myna dictation app. Read README.md, SECURITY.md and
            AI-ASSISTED.md first. Review the diff (gh pr diff) for:
            - correctness of packaging, scripts and workflows;
            - security: secrets, workflow permissions, untrusted input in run:
              steps, unpinned actions or downloads, signing and release paths;
            - license and attribution: Myna, Murmure, NVIDIA Parakeet and others
              must stay credited, AGPL source availability must hold;
            - user-facing docs that the change makes wrong.
            Be specific and brief; skip praise and style nits. Post one
            top-level comment with `gh pr comment`, and inline comments for
            specific lines. If the change touches signing, release, secrets,
            licensing, or anything you are unsure is safe, add the label with
            `gh pr edit --add-label needs-human` and say why. Never approve.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*)"

  mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@d5f7970ae232b6039636a16ea7f251e58e814f38 # v1.0.272
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"
            --append-system-prompt "You answer questions about macaw, the Debian packaging of Canonical's Myna. Answer and comment only: do not push, merge or release. For anything needing a maintainer's decision (security, licensing, releases), add the needs-human label."
