name: claude-review

# A Claude reviewer (anthropics/claude-code-action):
# - reviews each non-draft pull request from a branch of this repository;
# - answers "@claude" in issues and pull requests from people with write access.
# Claude itself never approves, merges, pushes or releases. When something
# needs a human decision it adds the `needs-human` label.
#
# Auto-merge: the automerge job turns on GitHub auto-merge (squash) for a pull
# request Claude reviewed without adding `needs-human`, and for Dependabot's
# hash-pinned bumps. Never for an upstream sync/ pull request (a maintainer
# merges those, and the merge releases: upstream-release.yml), nor for any
# other change under .github/, which the action refuses to review. The
# main ruleset makes the merge wait for green CI. A PR whose review did not
# run (no key) is never queued, and adding `needs-human` at any point turns
# auto-merge off. Other merges publish nothing: only a v* tag releases. See
# CONTRIBUTING.md, "Reviews".
#
# Pull requests from forks are skipped: they get no secrets, and the action
# refuses to run outside contributors' code anyway. Needs one secret,
# ANTHROPIC_API_KEY or CLAUDE_CODE_OAUTH_TOKEN; without it the jobs skip.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, labeled]
  # zizmor: ignore[dangerous-triggers] -- the action acts only for users with
  # write access, checks out the base branch (never PR code) and holds no
  # write credentials beyond comments and labels.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

env:
  HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' || secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}

jobs:
  review:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.action != 'labeled' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    outputs:
      # The action's own conclusion: on a pull request that edits this file
      # it skips itself, and the step still succeeds.
      reviewed: ${{ steps.claude.outputs.conclusion == 'success' }}
    steps:
      # With the myna submodule's history, so a sync/ pull request's real
      # changes can be read (git only; nothing is built or run).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        id: claude
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            You are the advisory reviewer for macaw, the Debian packaging of
            Canonical's Myna dictation app. Read README.md, SECURITY.md and
            AI-ASSISTED.md first. Review the diff (gh pr diff) for:
            - correctness of packaging, scripts and workflows;
            - security: secrets, workflow permissions, untrusted input in run:
              steps, unpinned actions or downloads, signing and release paths;
            - license and attribution: Myna, Murmure, NVIDIA Parakeet and others
              must stay credited, AGPL source availability must hold;
            - user-facing docs that the change makes wrong.
            If the pull request moves the myna submodule (a sync/vX.Y.Z pull
            request from upstream-sync), gh pr diff shows only the pointer
            OLD -> NEW; the checkout has myna at NEW with its history. Review
            the debian-native patches with `git -C myna log --oneline vX.Y.Z..NEW`
            and `git -C myna range-diff OLD_TAG..OLD vX.Y.Z..NEW` (OLD_TAG from
            `git -C myna describe --abbrev=0 OLD`), and upstream's changes with
            `git -C myna diff --stat OLD_TAG vX.Y.Z` and `git -C myna diff`,
            focusing on network access, downloads and their checksums,
            licensing, dependencies (Cargo.lock, requirements) and systemd
            units. Merging such a pull request publishes signed packages.
            Be specific and brief; skip praise and style nits. Post one
            top-level comment with `gh pr comment`, and inline comments for
            specific lines. A pull request you do not label is merged
            automatically once CI passes. So add the label with
            `gh pr edit --add-label needs-human`, and say why, if you find a
            bug or anything that should block merging, if you could not see
            the code that changes (for example a submodule range), or if the
            change touches signing, release, secrets, workflows, licensing, or
            anything you are unsure is safe. Never approve.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(git -C myna log:*),Bash(git -C myna diff:*),Bash(git -C myna show:*),Bash(git -C myna range-diff:*),Bash(git -C myna describe:*)"

  # Queues or cancels auto-merge; the merge itself waits on the ruleset's
  # required checks. No checkout and no PR code: only gh calls on metadata.
  automerge:
    needs: review
    if: >-
      always() &&
      github.event_name == 'pull_request' &&
      !github.event.pull_request.draft &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !startsWith(github.event.pull_request.head.ref, 'sync/') &&
      (github.event.action == 'labeled' ||
       needs.review.outputs.reviewed == 'true' ||
       (github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.html_url }}
          ACTION: ${{ github.event.action }}
          DEPENDABOT: ${{ github.actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]' }}
        run: |
          set -eu
          if gh pr view "$PR" --json labels --jq '.labels[].name' | grep -qx needs-human; then
            gh pr merge "$PR" --disable-auto 2>/dev/null || true
            echo "needs-human: auto-merge off"
          elif [ "$DEPENDABOT" != true ] && gh pr diff "$PR" --name-only | grep -q '^\.github/'; then
            # Workflow and repo-config changes always get a human merge.
            gh pr merge "$PR" --disable-auto 2>/dev/null || true
            echo ".github/ changed: auto-merge off"
          elif [ "$ACTION" != labeled ]; then
            gh pr merge "$PR" --auto --squash
          fi

  mention:
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.HAS_KEY == 'true'
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: anthropics/claude-code-action@acfe7992852970efb4fee683d63d628e3e52df67 # v1.0.286
        if: env.HAS_KEY == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --allowedTools "Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh pr edit:*)"
            --append-system-prompt "You answer questions about macaw, the Debian packaging of Canonical's Myna. Answer and comment only: do not push, merge or release. For anything needing a maintainer's decision (security, licensing, releases), add the needs-human label."
